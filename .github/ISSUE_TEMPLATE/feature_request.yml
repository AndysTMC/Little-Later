name: Feature request
description: Suggest something Little Later should do.
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: The problem
          description: What are you trying to do, and what gets in the way today?
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: What you would like
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives you considered
