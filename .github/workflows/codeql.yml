name: CodeQL

on:
    push:
        branches:
            - main
            - dev
    pull_request:
    schedule:
        - cron: "41 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read # needed by CodeQL to read workflow run metadata
            security-events: write # upload results to code scanning
        strategy:
            fail-fast: false
            matrix:
                language:
                    - javascript-typescript
                    - actions
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:${{ matrix.language }}
