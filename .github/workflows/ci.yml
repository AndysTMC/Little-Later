name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

    e2e:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Chromium for Playwright
              run: bunx playwright install --with-deps chromium

            - name: Build shared package
              run: bun run build:shared

            - name: End-to-end tests
              run: bun run test:e2e

            - name: Upload Playwright traces
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-results
                  path: test-results
                  retention-days: 7

    workflows:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Audit GitHub Actions workflows
              uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
              with:
                  version: "1.31.1"
                  advanced-security: false

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            # Fails a PR that adds a known-vulnerable package or one whose
            # license is not on this list of MIT-compatible licenses.
            - name: Review new dependencies
              uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
              with:
                  fail-on-severity: moderate
                  allow-licenses: >-
                      MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause,
                      Apache-2.0, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0,
                      Unlicense, Python-2.0, MPL-2.0
