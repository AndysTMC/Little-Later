name: Build & Release

on:
    push:
        tags:
            - "v*"
    # Re-run a release: start this from the tag itself (Use workflow from: tag).
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Require the tag to be on main
              run: |
                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "Tag ${GITHUB_REF_NAME} points at a commit that is not on main."
                    exit 1
                  fi

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build Shared Package
              run: bun run --filter little-shared build

            - name: Build Chrome Extension
              run: bun run build

            - name: Package zip, signed CRX, and checksums
              env:
                  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
              run: |
                  set -euo pipefail
                  mkdir -p dist-release

                  VERSION="${GITHUB_REF_NAME}"
                  VERSION="${VERSION#v}"

                  if [ -z "${SIGNING_KEY:-}" ]; then
                    echo "SIGNING_KEY secret is missing."
                    echo "Add an RSA private key PEM as the SIGNING_KEY Actions secret."
                    exit 1
                  fi

                  if [ ! -f dist/manifest.json ]; then
                    echo "Chrome extension build output not found at dist/manifest.json"
                    exit 1
                  fi

                  bun scripts/pack-crx.ts inject-manifest-key dist/manifest.json

                  (
                    cd dist
                    zip -r "${GITHUB_WORKSPACE}/dist-release/Little-Later-${VERSION}.zip" .
                  )

                  bun scripts/pack-crx.ts pack \
                    "dist-release/Little-Later-${VERSION}.zip" \
                    "dist-release/Little-Later-${VERSION}.crx"

                  cd dist-release
                  for file in *; do
                    if [[ -f "$file" && ! "$file" =~ \.sha256$ ]]; then
                      sha256sum "$file" > "${file}.sha256"
                    fi
                  done

                  for file in *; do
                    if [[ -f "$file" && ! "$file" =~ \.sha256$ && "$file" != "checksums.txt" ]]; then
                      sha256sum "$file" >> checksums.txt
                    fi
                  done

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      dist-release/*.zip
                      dist-release/*.crx

            - name: Keep release files for the publish job
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: release-files
                  path: dist-release
                  retention-days: 7

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download release files
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: release-files
                  path: dist-release

            - name: Create GitHub Release
              uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2.4.0
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  files: |
                      dist-release/*
                  draft: false
                  prerelease: false
                  fail_on_unmatched_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
