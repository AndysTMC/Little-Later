name: Build & Release

on:
    push:
        tags:
            - "v*"
    # Re-run a release: start this from the tag itself (Use workflow from: tag).
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Require the tag to be on main
              run: |
                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "Tag ${GITHUB_REF_NAME} points at a commit that is not on main."
                    exit 1
                  fi

            - name: Require matching versions and a changelog entry
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF_NAME#v}"
                  for file in manifest.json package.json packages/shared/package.json; do
                    found="$(jq -r .version "$file")"
                    if [ "$found" != "$VERSION" ]; then
                      echo "${file} has version ${found}, but the tag is ${GITHUB_REF_NAME}."
                      exit 1
                    fi
                  done
                  awk -v heading="## [${VERSION}]" '
                    index($0, heading) == 1 { found = 1; next }
                    found && /^## \[/ { exit }
                    found { print }
                  ' CHANGELOG.md > release-notes.md
                  if ! grep -q '[^[:space:]]' release-notes.md; then
                    echo "CHANGELOG.md has no entries under ## [${VERSION}]."
                    exit 1
                  fi

            # No dependency cache: a release must not restore files another
            # workflow run could have written.
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"
                  no-cache: true

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build Shared Package
              run: bun run --filter little-shared build

            - name: Build Chrome Extension
              run: bun run build

            - name: Package zip, signed CRX, and checksums
              env:
                  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
              run: |
                  set -euo pipefail
                  mkdir -p dist-release

                  VERSION="${GITHUB_REF_NAME}"
                  VERSION="${VERSION#v}"

                  if [ -z "${SIGNING_KEY:-}" ]; then
                    echo "SIGNING_KEY secret is missing."
                    echo "Add an RSA private key PEM as the SIGNING_KEY Actions secret."
                    exit 1
                  fi

                  if [ ! -f dist/manifest.json ]; then
                    echo "Chrome extension build output not found at dist/manifest.json"
                    exit 1
                  fi

                  bun scripts/pack-crx.ts inject-manifest-key dist/manifest.json

                  (
                    cd dist
                    zip -r "${GITHUB_WORKSPACE}/dist-release/Little-Later-${VERSION}.zip" .
                  )

                  bun scripts/pack-crx.ts pack \
                    "dist-release/Little-Later-${VERSION}.zip" \
                    "dist-release/Little-Later-${VERSION}.crx"

                  # The build writes a CycloneDX SBOM of the bundled packages.
                  cp dist/sbom.cdx.json "dist-release/Little-Later-${VERSION}.cdx.json"

                  cd dist-release
                  for file in *; do
                    if [[ -f "$file" && ! "$file" =~ \.sha256$ ]]; then
                      sha256sum "$file" > "${file}.sha256"
                    fi
                  done

                  for file in *; do
                    if [[ -f "$file" && ! "$file" =~ \.sha256$ && "$file" != "checksums.txt" ]]; then
                      sha256sum "$file" >> checksums.txt
                    fi
                  done

            - name: Attest build provenance
              id: attest
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      dist-release/*.zip
                      dist-release/*.crx
                      dist-release/*.cdx.json

            # Ship the signed attestation with the release, so it can be
            # verified offline: gh attestation verify --bundle <file>.
            - name: Add the provenance bundle to the release files
              env:
                  BUNDLE: ${{ steps.attest.outputs.bundle-path }}
              run: cp "$BUNDLE" "dist-release/Little-Later-${GITHUB_REF_NAME#v}.sigstore.json"

            - name: Keep release files for the publish job
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-files
                  path: |
                      dist-release
                      release-notes.md
                  retention-days: 7

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download release files
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-files

            # A re-run updates the existing release instead of failing.
            - name: Create or update the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" > /dev/null 2>&1; then
                    gh release upload "$TAG" dist-release/* --clobber
                    gh release edit "$TAG" --title "Release $TAG" --notes-file release-notes.md
                  else
                    gh release create "$TAG" dist-release/* --verify-tag \
                      --title "Release $TAG" --notes-file release-notes.md
                  fi
