version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      # One weekly pull request for every action update, majors included.
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: ci

    - package-ecosystem: bun
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
      # At most two weekly pull requests: one for minor and patch updates,
      # one for major updates, which are more likely to need code changes.
      groups:
          minor-and-patch:
              update-types: [minor, patch]
          major:
              update-types: [major]
      commit-message:
          prefix: build
